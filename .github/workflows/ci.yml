name: Verify DuoQuest
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: duoquest
          POSTGRES_PASSWORD: ci_only
          POSTGRES_DB: duoquest_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U duoquest -d duoquest_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://duoquest:ci_only@127.0.0.1:5432/duoquest_test?schema=public
      RUN_DB_TESTS: '1'
      PLAYWRIGHT_CHANNEL: chromium
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: cp .env.example .env
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm db:validate
      - run: pnpm db:deploy
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm format:check
      - run: pnpm build
      - run: pnpm db:seed
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build:ui-lab
      - run: pnpm test:ui-lab
      - run: pnpm test:e2e
      - run: pnpm test:e2e e2e/auth.spec.ts
        env:
          RUN_AUTH_E2E: '1'
