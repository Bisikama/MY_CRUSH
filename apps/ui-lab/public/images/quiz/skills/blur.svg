<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Làm mờ đáp án"><defs><linearGradient id="rim" x1="0%" y1="0%" x2="40%" y2="100%"><stop stop-color="#e2ceff"/><stop offset=".45" stop-color="#8d6bc5"/><stop offset="1" stop-color="#3b2d58"/></linearGradient><radialGradient id="base" cx="35%" cy="20%" r="95%"><stop stop-color="#8d6bc5"/><stop offset="1" stop-color="#3b2d58"/></radialGradient><linearGradient id="obj" x1="0%" y1="0%" x2="80%" y2="100%"><stop stop-color="#e2ceff"/><stop offset="1" stop-color="#8d6bc5"/></linearGradient><filter id="shadow" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#071b13" flood-opacity=".65"/></filter><filter id="soft"><feGaussianBlur stdDeviation="1.5"/></filter></defs><style> .bulb{transform-origin:64px 65px;animation:float 2.6s ease-in-out infinite}.rays{transform-origin:64px 54px;animation:shine 2.6s ease-in-out infinite}.vanish{animation:vanish 3.2s ease-in-out infinite}.leaf{transform-origin:32px 92px;animation:leaf 3s ease-in-out infinite}.fog{animation:fog 3.2s ease-in-out infinite}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}@keyframes shine{0%,100%{opacity:.55;transform:scale(.93)}50%{opacity:1;transform:scale(1.08)}}@keyframes vanish{0%,100%{opacity:1}45%,65%{opacity:.24}}@keyframes leaf{0%,100%{transform:rotate(0)}50%{transform:rotate(-12deg)}}@keyframes fog{0%,100%{transform:translateX(-3px);opacity:.7}50%{transform:translateX(4px);opacity:1}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><g filter="url(#shadow)"><circle cx="64" cy="66" r="56" fill="#3b2d58"/><circle cx="64" cy="62" r="54" fill="url(#rim)" stroke="#3b2d58" stroke-width="2"/><circle cx="64" cy="62" r="46" fill="url(#base)" stroke="#e2ceff" stroke-opacity=".55" stroke-width="1.5"/><path d="M22 48A44 44 0 0 1 85 22" fill="none" stroke="white" stroke-opacity=".35" stroke-width="3" stroke-linecap="round"/><path d="M35 105Q64 120 93 105" fill="none" stroke="#3b2d58" stroke-opacity=".65" stroke-width="3" stroke-linecap="round"/><g transform="translate(32 31)" fill="#d9d2ef" stroke="#64548d" stroke-width="2"><rect width="27" height="25" rx="7"/><rect x="37" width="27" height="25" rx="7"/><rect y="36" width="27" height="25" rx="7"/><rect x="37" y="36" width="27" height="25" rx="7"/><g stroke="#917eb3" stroke-width="3" stroke-linecap="round" filter="url(#soft)"><path d="M7 9h13M7 16h9M44 9h13M44 16h8M7 45h13M7 52h9M44 45h13M44 52h8"/></g></g><g class="fog" fill="none" stroke-linecap="round"><path d="M24 62c11-12 20 9 34-2s21-11 43-1M29 76c13-10 24 9 38-1s22-5 32-2" stroke="#e6d5ff" stroke-width="12" opacity=".9"/><path d="M26 58c12-8 19 8 33-2s23-8 42 1M32 72c13-7 22 8 35-2s21-5 30-2" stroke="#fff1ff" stroke-width="3" opacity=".8"/></g><path d="M91 23l2 5 5 2-5 2-2 5-2-5-5-2 5-2Z" fill="#fff0ff" class="rays"/></g></svg>
